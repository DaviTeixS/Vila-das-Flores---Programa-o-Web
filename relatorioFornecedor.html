<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório – Vila das Flores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #7aab7a;
            --cor-acento: #e8736a;
            --cor-fundo: #f7f3ef;
            --cor-escura: #4a5a4a;
            --cor-texto: #3a3a3a;
            --fonte-titulo: 'Playfair Display', serif;
            --fonte-corpo: 'Lato', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--fonte-corpo); background: var(--cor-fundo); color: var(--cor-texto); }

        header {
            background: white;
            padding: 1rem 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-circulo {
            width: 40px; height: 40px;
            background: var(--cor-primaria); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }
        header h1 { font-family: var(--fonte-titulo); font-size: 1.3rem; color: var(--cor-escura); }
        header a { margin-left: auto; font-size: 0.9rem; color: var(--cor-primaria); font-weight: 600; text-decoration: none; }

        .page-title {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
            font-family: var(--fonte-titulo);
            font-size: 2rem;
            color: var(--cor-escura);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto 3rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.25s;
        }
        .card:hover { transform: translateY(-4px); }
        .card h2 { color: var(--cor-escura); font-size: 1rem; margin-bottom: 0.75rem; font-family: var(--fonte-corpo); font-weight: 600; }
        .card p { font-size: 2rem; font-weight: 700; color: var(--cor-primaria); }

        .section-title {
            font-family: var(--fonte-titulo);
            font-size: 1.4rem;
            color: var(--cor-escura);
            margin-bottom: 1.25rem;
        }

        #listaProdutos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
        }
        .produto {
            background: white;
            padding: 1.25rem;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .produto h3 { color: var(--cor-escura); font-family: var(--fonte-titulo); margin-bottom: 0.5rem; }
        .produto p { font-size: 0.9rem; color: #666; margin: 4px 0; }

        .sem-acesso {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.1rem;
            color: #888;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-circulo">VF</div>
    <h1>Vila das Flores</h1>
    <a href="index.html">← Voltar</a>
</header>

<h1 class="page-title">Painel do Fornecedor</h1>

<div class="container" id="conteudo">
    <!-- Preenchido pelo JS -->
</div>

<script src="relatorioFornecedor.js"></script>
<script>
    // Proteção: só fornecedor acessa
    let tipo = localStorage.getItem("tipoUsuario");
    let conteudo = document.getElementById("conteudo");

    if (tipo !== "fornecedor") {
        conteudo.innerHTML = `<div class="sem-acesso">
            <p>⚠️ Acesso restrito a fornecedores.</p>
            <br>
            <a href="Login_julia.html" style="color: var(--cor-primaria); font-weight:600;">Fazer login como fornecedor</a>
        </div>`;
    } else {
        conteudo.innerHTML = `
            <div class="cards">
                <div class="card"><h2>Total de Produtos</h2><p id="totalProdutos">0</p></div>
                <div class="card"><h2>Valor Total</h2><p id="valorTotal">R$ 0</p></div>
                <div class="card"><h2>Categorias</h2><p id="totalCategorias">0</p></div>
            </div>
            <h2 class="section-title">Produtos Cadastrados</h2>
            <div id="listaProdutos"></div>
        `;
        // chama a função do relatorioFornecedor.js que preenche os dados
        if (typeof carregarRelatorio === "function") carregarRelatorio();
    }
</script>
</body>
</html>
