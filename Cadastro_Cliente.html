<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Cliente</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f3f3f3;
}
.container{
  background:white;
  padding:20px;
  width:300px;
  margin:50px auto;
  border-radius:10px;
}
input{
  width:90%;
  padding:10px;
  margin:8px;
}
button{
  padding:10px;
  margin:10px;
  background:#cba6f7;
  border:none;
  border-radius:10px;
}
</style>

</head>
<body>

<div class="container">
<h2>Cadastro Cliente</h2>

<input type="text" id="nome" placeholder="Nome completo">
<input type="text" placeholder="CPF" maxlength="11" pattern="[0-9]{11}" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="senha" placeholder="Senha" pattern="[0-9]{11}" required>
<input type="text" placeholder="Telefone (DDD)"maxlength="11" pattern="[0-9]{11}" required>
<input type="text" placeholder="Endereço">
<input type="text" placeholder="CEP" maxlength="8" pattern="[0-9]{8}" required>

<button onclick="cadastrar()">Finalizar Cadastro</button>
</div>

<script>

function cadastrar(){

  let nome = document.getElementById('nome').value;

  let email = document.getElementById('email').value;

  let senha = document.getElementById('senha').value;

  let usuarios =
  JSON.parse(localStorage.getItem('usuarios')) || [];

  usuarios.push({
    nome: nome,
    email: email,
    senha: senha
  });

  localStorage.setItem(
    'usuarios',
    JSON.stringify(usuarios)
  );

  alert("Cadastro realizado!");

  window.location.href = "Login.html";
}

</script>

</body>
</html>
