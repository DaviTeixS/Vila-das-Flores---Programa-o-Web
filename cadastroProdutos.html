<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Produtos</title>

<style>

    body {
        font-family: var(--fonte-corpo);
        background-color: var(--cor-fundo);
        color: var(--cor-texto);
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 360px;
        background: white;
        margin: 3rem auto;
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.10);
        text-align: center;
    }

    .container h2 {
        font-family: var(--fonte-titulo);
        color: var(--cor-escura);
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
    }

    input,
    select {
        width: 100%;
        padding: 0.7rem 1rem;
        margin-bottom: 0.75rem;
        border: 1.5px solid #d0cfc9;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: var(--fonte-corpo);
        font-size: 0.95rem;
        background: var(--cor-fundo);
        color: var(--cor-texto);
        outline: none;
        transition: border 0.2s;
    }

    input:focus,
    select:focus {
        border-color: var(--cor-primaria);
    }

    button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 999px;
        background: var(--cor-primaria);
        color: white;
        font-family: var(--fonte-corpo);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    button:hover {
        opacity: 0.85;
    }
</style>

    </head>

<body>

<div class="container">

<h2>Cadastro de Produto</h2>

<input type="text"
id="nomeProduto"
placeholder="Nome do produto"
required>

<input type="number"
id="precoProduto"
placeholder="Preço do produto"
required>

    <input
        type="number"
        id="quantidadeProduto"
        placeholder="Quantidade disponível"
        min="1"
         required
    >
    <input
        type="url"
        id="imagemProduto"
        placeholder="Link da imagem do produto"
    >

<select id="categoria">
    <option value="">Selecione a categoria</option>
    <option value="Flores">Flores</option>
    <option value="Buquês">Buquês</option>
    <option value="Vasos">Vasos</option>
    <option value="Decoração">Decoração</option>
</select>

<button onclick="cadastrarProduto()">
Cadastrar Produto
</button>

</div>
<script src="nav.js"></script>
<script src="cadastroProdutos.js"></script>

</body>
</html>
