<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatório</title>

<style>

body{
    font-family: Arial;
    background: #f4f4f4;
    padding: 20px;
}

.container{
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
}

.card{
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

button{
    background:#ff6b6b;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

<h1>Relatório do Sistema</h1>

<h2>Usuários cadastrados</h2>

<div id="usuarios"></div>

<h2>Produtos comprados</h2>

<div id="produtos"></div>

<h2 id="total"></h2>

</div>

<script>

let usuarios =
JSON.parse(localStorage.getItem("usuarios")) || [];

let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

let divUsuarios =
document.getElementById("usuarios");

usuarios.forEach((usuario) => {

    divUsuarios.innerHTML += `

    <div class="card">

    <h3>${usuario.nome}</h3>

    <p>${usuario.email}</p>

    </div>

    `;
});

let divProdutos =
document.getElementById("produtos");

let total = 0;

carrinho.forEach((produto) => {

    divProdutos.innerHTML += `

    <div class="card">

    <h3>${produto.nome}</h3>

    <p>Preço: R$ ${produto.preco}</p>

    </div>

    `;

    total += produto.preco;
});

document.getElementById("total").textContent =
"Total vendido: R$ " + total;

</script>

</body>
</html>
