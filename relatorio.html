<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <title>Relatório</title>

<style>

body{
    font-family: Arial;
    background: #f4f4f4;
    padding: 20px;
}

.container{
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
}

.card{
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Relatório de Compras</h1>

<div id="produtos"></div>

<h2 id="total"></h2>

</div>

<script>

let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

let divProdutos =
document.getElementById("produtos");

let total = 0;

carrinho.forEach((produto) => {

    divProdutos.innerHTML += `

    <div class="card">

    <h3>${produto.nome}</h3>

    <p>Preço: R$ ${produto.preco}</p>

    </div>

    `;

    total += produto.preco;
});

document.getElementById("total").textContent =
"Total vendido: R$ " + total;

</script>

</body>
</html>
