<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Fornecedor</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f3f3f3;
}

.container{
  background:white;
  padding:20px;
  width:300px;
  margin:50px auto;
  border-radius:10px;
}

input{
  width:90%;
  padding:10px;
  margin:8px;
}

button{
  padding:10px;
  margin:10px;
  background:#cba6f7;
  border:none;
  border-radius:10px;
}
</style>

</head>


<body>

<div class="container">

<h2>Cadastro Fornecedor</h2>


<input type="text"
id="nome"
placeholder="Nome completo"
oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ\s]/g, '')"
required>


<input type="text"
id="cnpj"
placeholder="CNPJ"
maxlength="14"
oninput="this.value = this.value.replace(/[^0-9]/g, '')"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="password"
id="senha"
placeholder="Senha"
required>


<input type="text"
id="telefone"
placeholder="Telefone"
maxlength="11"
oninput="this.value = this.value.replace(/[^0-9]/g, '')"
required>

<input type="text"
placeholder="Localidade da empresa">


<input type="text"
id="cep"
placeholder="CEP"
maxlength="8"
oninput="this.value = this.value.replace(/[^0-9]/g, '')"
required>

<button onclick="cadastrarFornecedor()">
Finalizar Cadastro
</button>

</div>


<script src="cadastroFornecedor.js"></script>
</body>
</html>
