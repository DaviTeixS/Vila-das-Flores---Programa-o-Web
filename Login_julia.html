<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<style>

body{
  font-family: Arial;
  text-align:center;
  background-image: url("fundo.jpg");
  background-size: cover;
  background-position: center;
}

.container{
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  padding:20px;
  width:300px;
  margin:100px auto;
  border-radius:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
}

input{
  width:90%;
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
}

button{
  padding:10px;
  margin:5px;
  background:#d8b4f8;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

button:hover{
  background:#c084fc;
}

</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="text"
id="email"
placeholder="Email"
required>

<input type="password"
id="senha"
placeholder="Senha">

<br>

<button onclick="entrar()">
Entrar
</button>

<button onclick="irCadastro()">
Cadastrar
</button>

</div>

<script>

function entrar(){

  let email = document.getElementById('email').value;
  let senha = document.getElementById('senha').value;

  let emailSalvo = localStorage.getItem('email');
  let senhaSalva = localStorage.getItem('senha');

  if(email === emailSalvo && senha === senhaSalva){

    alert('Login realizado!');

  } else {

    alert('Dados incorretos');

  }
}

function irCadastro(){

  
  let tipo = prompt("Digite: cliente ou fornecedor");

  
  tipo = tipo.toLowerCase();

  //cliente
  if(tipo === "cliente"){

    window.location.href = "Cadastro_Cliente_Julia.html";

  }

  // fornecedor
  else if(tipo === "fornecedor"){

    window.location.href = "Cadastro_Fornecedor_julia.html";

  }

  
  else{

    alert("Opção inválida! Digite cliente ou fornecedor.");

  }
}

</script>

</body>
</html>
