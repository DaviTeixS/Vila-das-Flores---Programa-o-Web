<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>


<style>

body{
  font-family: Arial;
  text-align:center;
  background-image: url("fundo.jpg");
  background-size: cover;
  background-position: center;
}

.container{
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  padding:20px;
  width:340px;
  margin:80px auto;
  border-radius:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.2);
}

input{
  width:90%;
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
}

button{
  padding:10px;
  margin:5px;
  background:#d8b4f8;
  border:none;
  border-radius:20px;
  cursor:pointer;
  width:90%;
}

button:hover{
  background:#c084fc;
}

label{
  font-size:14px;
}

.balao{
  margin-top:20px;
  background:#f3e8ff;
  padding:15px;
  border-radius:15px;
  display:none;
  animation: aparecer 0.5s;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateY(0px);
  }
}

</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="email"
id="email"
placeholder="Digite seu email">

<input type="password"
id="senha"
placeholder="Digite sua senha">

<br>

<label>
<input type="checkbox" onclick="mostrarSenha()">
Mostrar senha
</label>

<br><br>

<button onclick="entrar()">
Entrar
</button>


<button onclick="window.location.href='Cadastro Cliente.html'">

Cadastrar sou Cliente

</button>


<button onclick="window.location.href='Cadastro Fornecedor.html'">

Cadastrar sou Fornecedor

</button>

<button onclick="recuperarSenha()">

Esqueci minha senha

</button>


<div class="balao" id="balaoSenha">

</div>

</div>

<script>


function mostrarSenha(){

  let senha = document.getElementById("senha");

  if(senha.type === "password"){

    senha.type = "text";

  }else{

    senha.type = "password";

  }
}


function entrar(){

  let email = document.getElementById("email").value;
  let senha = document.getElementById("senha").value;

  let usuario = JSON.parse(localStorage.getItem(email));

  if(usuario){

    if(usuario.senha === senha){

      alert("Login realizado com sucesso!");

    }else{

      alert("Senha incorreta!");

    }

  }else{

    alert("Usuário não encontrado!");

  }
}


function recuperarSenha(){

  let email = prompt("Digite seu email cadastrado:");

  let usuario = JSON.parse(localStorage.getItem(email));

  let balao = document.getElementById("balaoSenha");

  if(usuario){

    balao.style.display = "block";

    balao.innerHTML = `

      <h3>Usuário Encontrado</h3>

      <p><b>Nome:</b> ${usuario.nome}</p>

      <p><b>Senha:</b> ${usuario.senha}</p>

    `;

  }else{

    balao.style.display = "block";

    balao.innerHTML = `

      <h3>Email não encontrado!</h3>

    `;

  }
}

</script>

</body>
</html>
